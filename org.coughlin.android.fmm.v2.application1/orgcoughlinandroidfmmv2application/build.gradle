apply plugin: 'com.android.application'


android {
    compileSdk 35
    defaultConfig {
        targetSdk 35
        minSdkVersion 26
        applicationId "com.example.yourapp" // Replace with your application ID
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11 // or VERSION_17
        targetCompatibility JavaVersion.VERSION_11 // or VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'org.coughlin.grocerylist'
}

dependencies {
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.work:work-runtime:2.11.1'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.room:room-common:2.8.4'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.work:work-runtime:2.11.1'
}




